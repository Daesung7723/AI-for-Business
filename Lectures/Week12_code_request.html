<script>
const STOPS = [[1.2, 1.25, "1: 1~2줄"], [3.8, 3.85, "1: 3줄"], [6.4, 6.45, "1: 4줄"], [9.0, 9.05, "1: 5~6줄"], [11.45, 13.75, "1: 주소 작성 → 요청 → 변환 → 확인"], [14.25, 14.3, "1: scene end"], [15.6, 15.65, "2: ① 조건 값으로 주소 작성"], [19.6, 19.65, "2: 내용"], [20.65, 22.95, "2: 변수의 값으로 주소가 완성됨"], [23.45, 23.5, "2: scene end"], [24.8, 24.85, "3: ② 요청과 시간 제한"], [28.8, 28.85, "3: 내용"], [29.85, 32.15, "3: 요청 = GET, 30초 안에 응답이 없으면 중단"], [32.65, 32.7, "3: scene end"], [34.0, 34.05, "4: ③ 응답 도착"], [38.0, 38.05, "4: 내용"], [39.05, 41.35, "4: 응답 = 상태 코드, 헤더, 본문"], [41.85, 41.9, "4: scene end"], [43.2, 43.25, "5: ④ 본문을 자료로 변환"], [47.2, 47.25, "5: 내용"], [48.25, 50.55, "5: json.loads = 본문의 글자를 프로그램의 자료로 변환"], [51.05, 51.1, "5: scene end"], [52.4, 52.45, "6: ⑤ 확인과 건수 대조"], [56.4, 56.45, "6: 내용"], [57.45, 59.75, "6: 오류가 없어도 받은 건수와 전체 건수를 대조"], [60.25, 60.3, "6: scene end"], [61.7, 61.75, "7: 연결"], [63.2, 63.25, "7: 주소"], [64.7, 64.75, "7: 인증"], [66.2, 66.25, "7: 요청 조건"], [67.7, 67.75, "7: 횟수"], [69.2, 69.25, "7: 서버"], [71.05, 73.35, "7: 문제가 있는 곳을 구분한 뒤 수정을 요청"], [73.85, 73.9, "7: scene end"], [75.2, 75.25, "8: 원본은 내 컴퓨터에"], [77.6, 77.65, "8: 사본이 서버에"], [78.85, 81.15, "8: 올리기 = 복사, 지침과 파일의 사본은 서버에 보관"], [81.65, 81.7, "8: scene end"], [84.4, 84.45, "9: 수정 전의 사본"], [87.2, 87.25, "9: 다시 올림"], [88.25, 90.55, "9: 원본을 수정하면 다시 올려야 스킬에 반영"], [91.05, 91.1, "9: scene end"], [92.4, 92.45, "10: 스킬은 서버에"], [95.0, 95.05, "10: 집 PC에서도 스킬 표시"], [96.2, 96.25, "10: 내려받은 파일은 그 PC에만"], [97.45, 99.75, "10: 스킬과 대화 기록은 서버에, 내려받은 파일은 그 PC에"], [100.25, 0.0, "10: scene end"]];            // [stop, resume, label] in seconds of the SVG timeline
const AUTOSTART = false;    // false = show the start cover and hold until the first click (motion guide 2026-10-13)
const svg = document.querySelector('#stage svg');
const wait = document.getElementById('wait');
const cover = document.getElementById('cover');
let i = 0, waiting = false, started = AUTOSTART;

function holdStart() {
  i = 0; waiting = false; started = false;
  svg.pauseAnimations(); svg.setCurrentTime(0);
  wait.classList.remove('on'); cover.classList.add('on');
}
function waitAt(k) {
  i = k; waiting = true;
  svg.pauseAnimations(); svg.setCurrentTime(STOPS[k][0]);
  wait.classList.add('on');
}
function next() {
  if (!started) { started = true; cover.classList.remove('on'); svg.unpauseAnimations(); return; }
  if (!waiting) { waitAt(i); return; }          // playing: jump to the next stop at once
  const resume = STOPS[i][1];
  waiting = false; wait.classList.remove('on');
  i = (i + 1) % STOPS.length;
  svg.setCurrentTime(resume); svg.unpauseAnimations();
}
function prev() { if (started) waitAt(Math.max(0, i - 1)); }
function restart() {
  if (!AUTOSTART) { holdStart(); return; }
  i = 0; waiting = false; wait.classList.remove('on'); svg.setCurrentTime(0); svg.unpauseAnimations();
}
function tick() {
  if (started && !waiting && svg.getCurrentTime() >= STOPS[i][0]) waitAt(i);
  requestAnimationFrame(tick);
}
document.addEventListener('click', next);
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'Enter', 'PageDown'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
  else if (e.key === 'r' || e.key === 'R') restart();
});
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 6000);
if (AUTOSTART) { svg.setCurrentTime(0); svg.unpauseAnimations(); } else { holdStart(); }
requestAnimationFrame(tick);
</script></body></html>
