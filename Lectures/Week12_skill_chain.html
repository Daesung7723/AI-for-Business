const STOPS = [[4.4, 4.45, "1: 마지막 결과"], [6.6, 6.65, "1: 한 번에 요청의 한계"], [7.65, 9.95, "1: 한 번에 요청 = 확인은 마지막 한 곳, 다시 하면 처음부터"], [10.45, 10.5, "1: scene end"], [12.0, 12.05, "2: 자료 정리"], [14.6, 14.65, "2: 사업 구조 작성"], [17.2, 17.25, "2: 원자료 대조"], [19.8, 19.85, "2: 가정 점검"], [22.25, 24.55, "2: 작업을 가장 잘게 나눈 단계 = 24개, 네 구간"], [25.05, 25.1, "2: scene end"], [26.6, 26.65, "3: 1단계 — 분석 범위"], [28.4, 28.45, "3: 12단계 — 원자료 확인 대상 1건"], [30.2, 30.25, "3: 13, 14단계 — 원자료를 직접 열어 대조"], [32.0, 32.05, "3: 18, 22단계 — 가정의 영향과 처리 판단"], [33.8, 33.85, "3: 24단계 — 핵심 가정의 선택"], [35.65, 37.95, "3: 사람이 정하거나 직접 확인하는 단계 = 끊을 수 있는 지점"], [38.45, 38.5, "3: scene end"], [40.0, 40.05, "4: 스킬 ①"], [41.9, 41.95, "4: 스킬 ②"], [43.8, 43.85, "4: 스킬 ③"], [45.8, 45.85, "4: 사람이 직접"], [47.05, 49.35, "4: 묶음은 각자 정함, 스킬은 2개 이상"], [49.85, 49.9, "4: scene end"], [52.6, 52.65, "5: 결과물 = 칸별 주장표"], [55.0, 55.05, "5: 주장 번호가 이어짐"], [56.65, 58.95, "5: 앞 스킬의 결과물을 붙여 넣어 전달, 주장 번호가 이어짐"], [59.45, 59.5, "5: scene end"], [60.6, 60.65, "6: 결과를 확인"], [62.6, 62.65, "6: 원자료 직접 대조"], [65.6, 65.65, "6: 대조 기록을 전달"], [67.05, 69.35, "6: 전달 전에 결과를 확인, 원자료 대조는 사람이 직접"], [69.85, 69.9, "6: scene end"], [71.4, 71.45, "7: 스킬 ①의 결과"], [72.8, 72.85, "7: 스킬 ②만 다시"], [75.0, 75.05, "7: 다시 하는 범위"], [76.05, 78.35, "7: 결과가 다르면 그 단계만 다시"], [78.85, 78.9, "7: scene end"], [80.6, 80.65, "8: 7단계 뒤"], [83.0, 83.05, "8: 5단계 뒤"], [85.05, 87.35, "8: 끊는 지점을 옮기면 전달할 결과물이 달라짐"], [87.85, 0.0, "8: scene end"]];            // [stop, resume, label] in seconds of the SVG timeline
const AUTOSTART = false;    // false = show the start cover and hold until the first click (motion guide 2026-10-13)
const svg = document.querySelector('#stage svg');
const wait = document.getElementById('wait');
const cover = document.getElementById('cover');
let i = 0, waiting = false, started = AUTOSTART;

function holdStart() {
  i = 0; waiting = false; started = false;
  svg.pauseAnimations(); svg.setCurrentTime(0);
  wait.classList.remove('on'); cover.classList.add('on');
}
function waitAt(k) {
  i = k; waiting = true;
  svg.pauseAnimations(); svg.setCurrentTime(STOPS[k][0]);
  wait.classList.add('on');
}
function next() {
  if (!started) { started = true; cover.classList.remove('on'); svg.unpauseAnimations(); return; }
  if (!waiting) { waitAt(i); return; }          // playing: jump to the next stop at once
  const resume = STOPS[i][1];
  waiting = false; wait.classList.remove('on');
  i = (i + 1) % STOPS.length;
  svg.setCurrentTime(resume); svg.unpauseAnimations();
}
function prev() { if (started) waitAt(Math.max(0, i - 1)); }
function restart() {
  if (!AUTOSTART) { holdStart(); return; }
  i = 0; waiting = false; wait.classList.remove('on'); svg.setCurrentTime(0); svg.unpauseAnimations();
}
function tick() {
  if (started && !waiting && svg.getCurrentTime() >= STOPS[i][0]) waitAt(i);
  requestAnimationFrame(tick);
}
document.addEventListener('click', next);
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'Enter', 'PageDown'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  }
  else if (e.key === 'r' || e.key === 'R') restart();
});
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 6000);
if (AUTOSTART) { svg.setCurrentTime(0); svg.unpauseAnimations(); } else { holdStart(); }
requestAnimationFrame(tick);
</script></body></html>
