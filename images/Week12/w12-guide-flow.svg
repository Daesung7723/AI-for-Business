<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>12주 실습의 흐름</title><desc>활동 1은 준비, 묶음 정하기, 1~7단계 자료 정리, 8~11단계 사업 구조 작성 순서로 진행한다. 활동 2는 12~16단계 원자료 대조, 17~23단계 가정 점검, 24단계 핵심 가정 목록, 보고서에 반영 순서로 진행한다. 스킬로 묶는 범위는 각자 정하고, 앞 스킬의 결과를 다음 스킬에 붙여 넣는다.</desc><defs><marker id="a5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="340" fill="#FFFFFF"/>
<g font-size="13" font-weight="700" fill="#006199"><text x="20" y="34">활동 1 — 스킬 연결로 사업 구조 작성</text><text x="20" y="178">활동 2 — 원자료 대조와 가정 점검</text></g>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="46" width="140" height="70" rx="8"/><rect x="180" y="46" width="140" height="70" rx="8"/></g>
<g fill="#E8F5FC" stroke="#0086CD" stroke-width="1"><rect x="340" y="46" width="140" height="70" rx="8"/><rect x="500" y="46" width="160" height="70" rx="8"/><rect x="20" y="190" width="140" height="70" rx="8"/><rect x="180" y="190" width="140" height="70" rx="8"/><rect x="340" y="190" width="140" height="70" rx="8"/></g>
<rect x="500" y="190" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#006199" stroke-width="1.5"/>
<g font-size="12.5" font-weight="700" fill="#006199" text-anchor="middle"><text x="90" y="74">준비</text><text x="250" y="74">묶음 정하기</text><text x="410" y="74">1~7 자료 정리</text><text x="580" y="74">8~11 사업 구조 작성</text><text x="90" y="218">12~16 원자료 대조</text><text x="250" y="218">17~23 가정 점검</text><text x="410" y="218">24 핵심 가정 목록</text><text x="580" y="218">보고서에 반영</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="90" y="96">보고서 사본, 스킬 화면</text><text x="250" y="96">스킬 2개 이상</text><text x="410" y="96">번호가 있는 주장표</text><text x="580" y="96">캔버스 초안, 연결 문장</text><text x="90" y="240">원자료는 직접 열기</text><text x="250" y="240">영향과 확인 상태</text><text x="410" y="240">13주에 다시 사용</text><text x="580" y="240">본인의 문장, 부록 기록</text></g>
<g stroke="#2EA7E0" stroke-width="1.75" fill="none"><line x1="162" y1="81" x2="176" y2="81" marker-end="url(#a5)"/><line x1="322" y1="81" x2="336" y2="81" marker-end="url(#a5)"/><line x1="482" y1="81" x2="496" y2="81" marker-end="url(#a5)"/><line x1="162" y1="225" x2="176" y2="225" marker-end="url(#a5)"/><line x1="322" y1="225" x2="336" y2="225" marker-end="url(#a5)"/><line x1="482" y1="225" x2="496" y2="225" marker-end="url(#a5)"/></g>
<line x1="20" y1="142" x2="660" y2="142" stroke="#485A64" stroke-width="0.75" stroke-dasharray="5 4"/>
<text x="340" y="137" font-size="11.5" fill="#485A64" text-anchor="middle">⛔ 여기까지 활동 1</text>
<text x="340" y="296" font-size="12.5" fill="#485A64" text-anchor="middle">스킬로 묶는 범위는 각자 정함 / 앞 스킬의 결과를 다음 스킬에 붙여 넣어 전달</text>
<text x="340" y="318" font-size="11.5" fill="#485A64" text-anchor="middle">세부 단계 24개와 끊을 수 있는 지점 5곳 = 실습 지침</text>
</svg>
