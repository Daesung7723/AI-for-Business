<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>BMC와 린 캔버스 — 바꾼 네 칸</title><desc>왼쪽은 BMC, 오른쪽은 린 캔버스다. 아홉 칸의 배치는 같다. BMC의 핵심 파트너십, 핵심 활동, 핵심 자원, 고객 관계 네 칸이 린 캔버스에서는 문제, 솔루션, 핵심 지표, 결정적 강점으로 바뀐다. 가치 제안, 채널, 고객 세그먼트, 비용 구조, 수익원 다섯 칸은 같다.</desc><rect width="680" height="330" fill="#FFFFFF"/>
<g font-size="14" font-weight="700" fill="#006199" text-anchor="middle"><text x="175" y="34">BMC — 운영 중인 사업의 분석</text><text x="505" y="34">린 캔버스 — 새 사업의 가정 정리</text></g>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="50" width="62" height="160"/><rect x="82" y="50" width="62" height="80"/><rect x="82" y="130" width="62" height="80"/><rect x="206" y="50" width="62" height="80"/></g>
<g fill="#FFFFFF" stroke="#485A64" stroke-width="0.75"><rect x="144" y="50" width="62" height="160"/><rect x="206" y="130" width="62" height="80"/><rect x="268" y="50" width="62" height="160"/><rect x="20" y="210" width="155" height="56"/><rect x="175" y="210" width="155" height="56"/></g>
<g fill="#E8F5FC" stroke="#0086CD" stroke-width="1.25"><rect x="350" y="50" width="62" height="160"/><rect x="412" y="50" width="62" height="80"/><rect x="412" y="130" width="62" height="80"/><rect x="536" y="50" width="62" height="80"/></g>
<g fill="#FFFFFF" stroke="#485A64" stroke-width="0.75"><rect x="474" y="50" width="62" height="160"/><rect x="536" y="130" width="62" height="80"/><rect x="598" y="50" width="62" height="160"/><rect x="350" y="210" width="155" height="56"/><rect x="505" y="210" width="155" height="56"/></g>
<g font-size="11.5" fill="#485A64" text-anchor="middle"><text x="51" y="126">핵심</text><text x="51" y="142">파트너십</text><text x="113" y="86">핵심</text><text x="113" y="102">활동</text><text x="113" y="166">핵심</text><text x="113" y="182">자원</text><text x="175" y="126">가치</text><text x="175" y="142">제안</text><text x="237" y="86">고객</text><text x="237" y="102">관계</text><text x="237" y="174">채널</text><text x="299" y="126">고객</text><text x="299" y="142">세그먼트</text><text x="97" y="242">비용 구조</text><text x="252" y="242">수익원</text><text x="505" y="126">가치</text><text x="505" y="142">제안</text><text x="567" y="174">채널</text><text x="629" y="126">고객</text><text x="629" y="142">세그먼트</text><text x="427" y="242">비용 구조</text><text x="582" y="242">수익원</text></g>
<g font-size="12" font-weight="700" fill="#006199" text-anchor="middle"><text x="381" y="134">문제</text><text x="443" y="94">솔루션</text><text x="443" y="166">핵심</text><text x="443" y="182">지표</text><text x="567" y="86">결정적</text><text x="567" y="102">강점</text></g>
<text x="340" y="302" font-size="12.5" fill="#485A64" text-anchor="middle">칸의 배치는 같고, 색으로 표시한 네 칸의 질문이 다름</text>
</svg>
