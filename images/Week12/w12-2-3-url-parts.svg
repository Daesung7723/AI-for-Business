<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>주소의 구성</title><desc>KOSIS 통계 조회 주소를 네 부분으로 나눈 그림이다. https://는 프로토콜, kosis.kr는 도메인, /openapi/Param/statisticsParameterData.do는 경로, 물음표 뒤의 orgId=101, tblId=DT_1JC1511, prdSe=Y는 조건이다.</desc><rect width="680" height="250" fill="#FFFFFF"/>
<text x="340" y="30" font-size="14" font-weight="700" fill="#006199" text-anchor="middle">주소 하나를 네 부분으로 읽기 — 7주 KOSIS 주소</text>
<rect x="34" y="46" width="612" height="34" rx="6" fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"/>
<g font-family="Consolas,'Malgun Gothic',monospace" font-size="11.5" fill="#485A64"><text x="46" y="68" textLength="50" lengthAdjust="spacingAndGlyphs">https://</text><text x="98" y="68" textLength="50" lengthAdjust="spacingAndGlyphs" fill="#006199" font-weight="700">kosis.kr</text><text x="150" y="68" textLength="258" lengthAdjust="spacingAndGlyphs">/openapi/Param/statisticsParameterData.do</text><text x="410" y="68" textLength="222" lengthAdjust="spacingAndGlyphs" fill="#006199" font-weight="700">?orgId=101&amp;tblId=DT_1JC1511&amp;prdSe=Y</text></g>
<g stroke="#0086CD" stroke-width="2" fill="none"><line x1="46" y1="88" x2="96" y2="88"/><line x1="98" y1="88" x2="148" y2="88"/><line x1="150" y1="88" x2="408" y2="88"/><line x1="410" y1="88" x2="632" y2="88"/></g>
<g stroke="#2EA7E0" stroke-width="1.25" fill="none"><line x1="71" y1="88" x2="95" y2="124"/><line x1="123" y1="88" x2="255" y2="124"/><line x1="279" y1="88" x2="415" y2="124"/><line x1="521" y1="88" x2="585" y2="124"/></g>
<g fill="#E8F5FC" stroke="#0086CD" stroke-width="1"><rect x="20" y="124" width="150" height="70" rx="8"/><rect x="180" y="124" width="150" height="70" rx="8"/><rect x="340" y="124" width="150" height="70" rx="8"/><rect x="510" y="124" width="150" height="70" rx="8"/></g>
<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="95" y="152">프로토콜</text><text x="255" y="152">도메인</text><text x="415" y="152">경로</text><text x="585" y="152">조건</text></g>
<g font-size="11.5" fill="#485A64" text-anchor="middle"><text x="95" y="176">통신 규칙</text><text x="255" y="176">요청을 받는 서버의 이름</text><text x="415" y="176">요청하는 자료나 기능</text><text x="585" y="176">「이름=값」을 &amp;로 연결</text></g>
<text x="340" y="226" font-size="12.5" fill="#485A64" text-anchor="middle">조건의 값을 바꾸면 같은 서버의 같은 기능이 다른 응답을 보냄</text>
</svg>
