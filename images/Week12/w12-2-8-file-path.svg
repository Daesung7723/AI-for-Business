<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>파일이 오가는 길</title><desc>올리기는 내 컴퓨터에 있는 보고서 원본의 사본을 서버로 전송하는 일이다. 원본은 내 컴퓨터에 그대로 있고, 원본을 수정해도 서버의 사본은 바뀌지 않는다. 내려받기는 서버에 있는 결과를 내 컴퓨터의 파일로 저장하는 일이다.</desc><defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="300" fill="#FFFFFF"/>
<rect x="20" y="30" width="210" height="210" rx="8" fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"/>
<rect x="450" y="30" width="210" height="210" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/>
<g font-size="14" font-weight="700" fill="#006199" text-anchor="middle"><text x="125" y="56">내 컴퓨터</text><text x="555" y="56">서버</text></g>
<g fill="#FFFFFF" stroke="#485A64" stroke-width="0.75"><rect x="36" y="74" width="178" height="62" rx="6"/><rect x="36" y="160" width="178" height="62" rx="6"/></g>
<g fill="#FFFFFF" stroke="#0086CD" stroke-width="0.75"><rect x="466" y="74" width="178" height="62" rx="6"/><rect x="466" y="160" width="178" height="62" rx="6"/></g>
<g font-size="12.5" font-weight="700" fill="#006199" text-anchor="middle"><text x="125" y="98">보고서 원본</text><text x="125" y="184">내려받은 파일</text><text x="555" y="98">보고서 사본</text><text x="555" y="184">결과(답, 표)</text><text x="340" y="96">올리기</text><text x="340" y="182">내려받기</text></g>
<g font-size="11.5" fill="#485A64" text-anchor="middle"><text x="125" y="120">올린 뒤에도 그대로 있음</text><text x="125" y="206">저장해야 내 컴퓨터에 남음</text><text x="555" y="120">원본을 수정해도 바뀌지 않음</text><text x="555" y="206">대화 안에 있음</text><text x="340" y="126">사본을 전송(복사)</text><text x="340" y="212">결과를 파일로 저장</text></g>
<g stroke="#2EA7E0" stroke-width="1.75" fill="none"><line x1="238" y1="106" x2="442" y2="106" marker-end="url(#a2)"/><line x1="442" y1="192" x2="238" y2="192" marker-end="url(#a2)"/></g>
<text x="340" y="274" font-size="12.5" fill="#485A64" text-anchor="middle">올리기 = 이동이 아니라 복사 / 수정한 내용을 반영하려면 다시 올리기</text>
</svg>
