<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>요청과 응답의 구성</title><desc>요청은 방식과 주소, 헤더, 본문으로 구성된다. 6주 코드의 요청은 GET 방식으로 ECOS 주소에 보내며 본문이 없다. 응답은 상태 코드, 헤더, 본문으로 구성된다. ECOS의 응답은 상태 코드 200, 형식 application/json, 본문은 StatisticSearch로 시작하는 JSON이다.</desc><defs><marker id="a7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="300" fill="#FFFFFF"/>
<rect x="20" y="28" width="290" height="222" rx="8" fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"/>
<rect x="370" y="28" width="290" height="222" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/>
<g font-size="14" font-weight="700" fill="#006199" text-anchor="middle"><text x="165" y="52">요청 — 내 컴퓨터가 보냄</text><text x="515" y="52">응답 — 서버가 보냄</text></g>
<g fill="#FFFFFF" stroke="#485A64" stroke-width="0.75"><rect x="34" y="64" width="262" height="54" rx="6"/><rect x="34" y="124" width="262" height="54" rx="6"/><rect x="34" y="184" width="262" height="54" rx="6"/></g>
<g fill="#FFFFFF" stroke="#0086CD" stroke-width="0.75"><rect x="384" y="64" width="262" height="54" rx="6"/><rect x="384" y="124" width="262" height="54" rx="6"/><rect x="384" y="184" width="262" height="54" rx="6"/></g>
<g font-size="12.5" font-weight="700" fill="#006199"><text x="46" y="85">방식과 주소</text><text x="46" y="145">헤더</text><text x="46" y="205">본문</text><text x="396" y="85">상태 코드</text><text x="396" y="145">헤더</text><text x="396" y="205">본문</text></g>
<g font-size="11" fill="#485A64"><text x="46" y="106" font-family="Consolas,'Malgun Gothic',monospace">GET https://ecos.bok.or.kr/api/…</text><text x="46" y="166">부가 정보(로그인 정보, 형식)</text><text x="46" y="226">보내는 내용 — GET 요청은 없음</text><text x="396" y="106" font-family="Consolas,'Malgun Gothic',monospace">200</text><text x="430" y="106">요청을 처리해 결과를 보냄</text><text x="396" y="166" font-family="Consolas,'Malgun Gothic',monospace">application/json</text><text x="396" y="226" font-family="Consolas,'Malgun Gothic',monospace">{"StatisticSearch": {"row": [ … ]}}</text></g>
<line x1="316" y1="139" x2="364" y2="139" stroke="#2EA7E0" stroke-width="1.75" marker-end="url(#a7)"/>
<text x="340" y="128" font-size="11" fill="#2EA7E0" text-anchor="middle">처리</text>
<text x="340" y="278" font-size="12.5" fill="#485A64" text-anchor="middle">6주 코드의 요청과 ECOS의 응답 — 상태 코드와 본문을 둘 다 확인</text>
</svg>
