<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="370" y="398">메모리</text><text x="555" y="398">CPU</text></g>
<g font-size="11" fill="#485A64"><text x="50" y="415">편집기에서 저장한 코드 파일</text><text x="370" y="415" text-anchor="middle">실행 중인 프로그램과 데이터</text><text x="555" y="415" text-anchor="middle">실행기의 명령을 실행(계산)</text></g>
