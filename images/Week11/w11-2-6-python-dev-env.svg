<g font-size="11" font-weight="700" fill="#006199" text-anchor="middle"><text x="373" y="116">③ 한 줄 실행</text><text x="373" y="148">④ 출력(print), 오류</text><text x="373" y="180">④ 입력(input)</text><text x="373" y="253">② F5 실행</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="373" y="275">Shell을 다시 시작한 뒤</text><text x="373" y="289">저장한 파일을 실행</text></g>
<rect x="20" y="322" width="640" height="26" rx="6" fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"/><text x="400" y="339" text-anchor="middle" font-size="11" fill="#485A64"><tspan font-size="12" font-weight="700" fill="#006199">운영체제(Windows)</tspan> — 파일 읽기와 저장, 화면 표시를 처리</text>
<rect x="20" y="366" width="640" height="66" rx="8" fill="#FFFFFF" stroke="#485A64" stroke-width="0.75"/>
<rect x="36" y="356" width="80" height="20" rx="10" fill="#485A64"/><text x="76" y="370" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">하드웨어</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="36" y="380" width="238" height="44" rx="6"/><rect x="290" y="380" width="160" height="44" rx="6"/><rect x="466" y="380" width="178" height="44" rx="6"/></g>
