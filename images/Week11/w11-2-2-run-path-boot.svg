<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>부팅과 실행 경로</title><desc>왼쪽은 전원을 켤 때 한 번 일어나는 부팅으로, 전원, 펌웨어의 장치 점검과 초기화, 운영체제 불러오기, 로그인 화면 순서다. 오른쪽은 판매 분석을 실행할 때마다 거치는 경로로, 사용자의 실행 명령이 프로그램과 운영체제를 거쳐 하드웨어의 저장장치, 메모리, CPU에서 처리되고 결과가 화면과 결과 파일로 돌아온다. 코드를 요청한 곳은 인터넷 너머의 서버이고 코드를 실행한 곳은 이 PC다.</desc><defs><marker id="b1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="440" fill="#FFFFFF"/>
<rect x="20" y="12" width="250" height="28" rx="14" fill="#006199"/><text x="145" y="31" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">부팅 — 전원을 켤 때 한 번</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="52" width="250" height="56" rx="8"/><rect x="20" y="128" width="250" height="56" rx="8"/><rect x="20" y="204" width="250" height="56" rx="8"/><rect x="20" y="280" width="250" height="56" rx="8"/></g>
<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="145" y="75">① 전원 켜기</text><text x="145" y="151">② 펌웨어(UEFI)</text><text x="145" y="227">③ 운영체제 불러오기</text><text x="145" y="303">④ 로그인 화면</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="145" y="95">메인보드에 전원 공급</text><text x="145" y="171">장치 점검과 초기화</text><text x="145" y="247">저장장치 → 메모리</text><text x="145" y="323">프로그램을 실행할 준비 완료</text></g>
<g stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#b1)"><line x1="145" y1="108" x2="145" y2="126"/><line x1="145" y1="184" x2="145" y2="202"/><line x1="145" y1="260" x2="145" y2="278"/></g>
<rect x="290" y="12" width="370" height="28" rx="14" fill="#0086CD"/><text x="475" y="31" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">실행 — 판매 분석을 할 때마다</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="290" y="52" width="290" height="56" rx="8"/><rect x="290" y="128" width="290" height="56" rx="8"/><rect x="290" y="204" width="290" height="56" rx="8"/><rect x="290" y="280" width="290" height="56" rx="8"/></g>
<g font-size="12" font-weight="700" fill="#006199"><text x="304" y="75">사용자</text><text x="304" y="151">프로그램 — IDLE, Python</text><text x="304" y="227">운영체제 — Windows</text><text x="304" y="303">하드웨어</text></g>
<g font-size="11" fill="#485A64"><text x="304" y="95">IDLE에서 Run Module(F5)</text><text x="304" y="171">코드를 한 줄씩 해석해 실행을 요청</text><text x="304" y="247">파일 읽기, 화면 표시, 파일 저장을 처리</text><text x="304" y="323">저장장치 ⇄ 메모리 ⇄ CPU(계산)</text></g>
<g stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#b1)"><line x1="600" y1="80" x2="600" y2="308"/><line x1="640" y1="308" x2="640" y2="80"/></g>
<g font-size="11" font-weight="700" fill="#006199" text-anchor="middle"><text x="600" y="326">요청</text><text x="640" y="70">결과</text></g>
<rect x="20" y="354" width="640" height="34" rx="6" fill="#FFF3CD" stroke="#485A64" stroke-width="0.75"/><text x="340" y="376" text-anchor="middle" font-size="12" fill="#485A64">펌웨어는 부팅 때 장치를 준비하는 역할 — 분석을 실행하는 경로의 중간 단계가 아님</text>
<rect x="20" y="398" width="640" height="34" rx="6" fill="#006199"/><text x="340" y="420" text-anchor="middle" font-size="12" fill="#FFFFFF">코드를 요청한 곳 = 인터넷 너머 Gemini의 서버(12주)   |   코드를 실행한 곳 = 이 PC</text></svg>
