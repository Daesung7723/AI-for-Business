<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 792" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>과제 3 트랙 A의 진행 흐름</title><desc>보고서 다섯 부분을 Phase 1부터 5까지 구분했다. 각 Phase의 위쪽 회색 칸은 과제 2에서 활용하는 내용이고 아래쪽 붉은 칸은 새로 보완할 점이다. 환경 분석의 결과는 SWOT의 기회와 위협으로, 수익 구조와 재무의 결과는 강점과 약점으로 이어지고, 네 Phase의 결과가 제언의 근거가 된다.</desc><defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="792" fill="#FFFFFF"/>
<g font-size="12" font-weight="700" fill="#485A64" text-anchor="middle"><text x="255" y="30">과제 2 활용 + 새로 보완</text><text x="485" y="30">결과</text></g>
<g transform="translate(0,24)">
