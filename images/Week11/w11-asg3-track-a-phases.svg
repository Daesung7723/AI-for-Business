<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="130" y="30" width="250" height="46" rx="6"/><rect x="130" y="172" width="250" height="46" rx="6"/><rect x="130" y="314" width="250" height="46" rx="6"/><rect x="130" y="456" width="250" height="46" rx="6"/><rect x="130" y="598" width="510" height="42" rx="6"/></g>
