<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>과제 3 트랙 B의 진행 흐름</title><desc>보고서 네 부분을 Phase 1부터 4까지 구분했다. 각 Phase의 위쪽 회색 칸은 과제 2에서 활용하는 내용이고 아래쪽 붉은 칸은 새로 보완할 점이다. 목표 고객과 문제 문장은 린 캔버스와 시장 규모로 이어지고, 시장 규모는 하향식과 상향식 두 방향으로 계산해 차이의 원인을 찾으며, 린 캔버스의 핵심 가정과 시장 규모의 불확실한 수가 검증 질문으로 이어져 확인 결과와 판단으로 끝난다.</desc><defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="684" fill="#FFFFFF"/>
<g font-size="12" font-weight="700" fill="#485A64" text-anchor="middle"><text x="255" y="30">과제 2 활용 + 새로 보완</text><text x="485" y="30">결과</text></g>
<g transform="translate(0,24)">
<g fill="none" stroke="#C9D1D9" stroke-width="0.75"><rect x="20" y="20" width="640" height="114" rx="10"/><rect x="20" y="162" width="640" height="114" rx="10"/><rect x="20" y="304" width="640" height="114" rx="10"/><rect x="20" y="446" width="640" height="130" rx="10"/></g>
<g font-size="14" font-weight="700" fill="#006199"><text x="34" y="72">Phase 1</text><text x="34" y="204">Phase 2</text><text x="34" y="356">Phase 3</text><text x="34" y="496">Phase 4</text></g>
<g font-size="12" fill="#485A64"><text x="34" y="92">문제와 고객</text><text x="34" y="224">린 캔버스</text><text x="34" y="242">12주 수업 뒤</text><text x="34" y="376">시장 규모</text><text x="34" y="394">13주 수업 뒤</text><text x="34" y="516">검증 질문과 결과</text><text x="34" y="534">12주 수업 뒤</text><text x="34" y="552" font-size="11">원칙 = 7주 보충</text></g>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="130" y="30" width="250" height="46" rx="6"/><rect x="130" y="172" width="250" height="46" rx="6"/><rect x="130" y="314" width="250" height="46" rx="6"/><rect x="130" y="456" width="250" height="46" rx="6"/></g>
<g font-size="14" font-weight="700" fill="#485A64" text-anchor="middle"><text x="255" y="50">목표 고객 · 문제 서술</text><text x="255" y="192">조사 결과 · 목표 고객</text><text x="255" y="334">조사한 시장 수치 · 출처</text><text x="255" y="476">「미확인」 항목 · 검증 기록</text></g>
<g font-size="12" fill="#485A64" text-anchor="middle"><text x="255" y="67">과제 2의 세분화 · 페르소나 또는 3C</text><text x="255" y="209">아홉 칸을 채우는 근거 자료</text><text x="255" y="351">과제 2의 조사 결과 · 검증 기록</text><text x="255" y="493">과제 2에서 확인하지 못한 내용</text></g>
<g fill="#FDECEA" stroke="#C0392B" stroke-width="0.75"><rect x="130" y="80" width="250" height="44" rx="6"/><rect x="130" y="222" width="250" height="44" rx="6"/><rect x="130" y="364" width="250" height="44" rx="6"/><rect x="130" y="506" width="250" height="60" rx="6"/></g>
<g font-size="12" fill="#B3261E"><text x="142" y="98">+ JTBD 문제 1문장</text><text x="142" y="115">+ 자료 · 상상 구분 · 3C 선택 시 페르소나</text><text x="142" y="240">+ 아홉 칸으로 구조화</text><text x="142" y="257">+ 틀리면 성립하지 않는 칸 표시</text><text x="142" y="382">+ 전체, 유효, 목표 시장의 자릿수 판단</text><text x="142" y="399">+ 하향식, 상향식 계산과 차이의 원인</text><text x="142" y="524">+ 과거 경험을 묻는 질문 설계</text><text x="142" y="541">+ 사람이나 자료로 확인한 결과 기록</text><text x="142" y="558">+ 검증 결과로 본 아이디어 판단 1문장</text></g>
