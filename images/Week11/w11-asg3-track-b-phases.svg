<g font-size="12" fill="#B3261E" text-anchor="middle"><text x="485" y="93">누구의 어떤 문제인가</text><text x="485" y="235">가장 먼저 확인할 칸</text><text x="485" y="377">출처 · 기준 연도 표기</text><text x="485" y="526">확인 못한 가정도 기록</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.25"><path d="M380 53H395V78"/><path d="M380 102H395V78H408" marker-end="url(#m1)"/><path d="M380 195H395V220"/><path d="M380 244H395V220H408" marker-end="url(#m1)"/><path d="M380 337H395V362"/><path d="M380 386H395V362H408" marker-end="url(#m1)"/><path d="M380 479H395V511"/><path d="M380 536H395V511H408" marker-end="url(#m1)"/><path d="M430 103V148H255V170" marker-end="url(#m1)"/><path d="M560 78H585V290H255V312" marker-end="url(#m1)"/><path d="M560 220H610V432H290V454" marker-end="url(#m1)"/><path d="M450 387V424H240V454" marker-end="url(#m1)"/></g>
<g font-size="12" fill="#485A64" text-anchor="end"><text x="247" y="152">문제 · 고객 칸으로</text><text x="247" y="294">목표 고객 → 목표 시장</text><text x="232" y="438">시장 규모의 불확실한 수 → 검증 후보</text></g>
<rect x="130" y="589" width="22" height="14" rx="3" fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"/><text x="158" y="600" font-size="12" fill="#485A64">과제 2에서 활용</text>
<rect x="330" y="589" width="22" height="14" rx="3" fill="#FDECEA" stroke="#C0392B" stroke-width="0.75"/><text x="358" y="600" font-size="12" fill="#B3261E">과제 3에서 새로 보완</text>
<rect x="20" y="614" width="640" height="32" rx="4" fill="#006199"/><text x="340" y="635" text-anchor="middle" font-size="13" fill="#FFFFFF">과제 2의 결과에 붉은 칸의 내용을 더하면 최종 보고서가 된다</text>
