<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>11주 실습 지침의 흐름</title><desc>활동 1은 준비, 지침 작성, 사례 파일 첨부와 저장, 다시 열어 첫 요청의 네 단계이고, 강의자료 4절 설명을 들은 뒤 활동 2의 지침 한 줄 바꾸기, Gemini Notebook 비교, 보관을 진행한다. 그 뒤 선택으로 스킬을 만들고, 미션에서 참고 파일을 각자의 과제 2 보고서로 바꾼다. 모든 단계는 각자 진행한다.</desc><defs><marker id="g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="352" fill="#FFFFFF"/>
<rect x="20" y="12" width="640" height="26" rx="13" fill="#006199"/><text x="340" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">활동 1 — 공통 사례로 전략 Gem 만들기 (각자)</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="46" width="145" height="72" rx="8"/><rect x="185" y="46" width="145" height="72" rx="8"/><rect x="350" y="46" width="145" height="72" rx="8"/><rect x="515" y="46" width="145" height="72" rx="8"/></g>
<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="92.5" y="68">준비</text><text x="257.5" y="68">1 지침 작성</text><text x="422.5" y="68">2 파일 첨부, 저장</text><text x="587.5" y="68">3 첫 요청</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="92.5" y="88">사례 파일 내려받기</text><text x="92.5" y="106">「+ 새 Gem」 열기</text><text x="257.5" y="88">역할, 목표</text><text x="257.5" y="106">사용 규칙, 출력 형식</text><text x="422.5" y="88">사례 파일 첨부</text><text x="422.5" y="106">Gem 목록에서 확인</text><text x="587.5" y="88">근거 문단 [n]</text><text x="587.5" y="106">「파일 밖」 표시</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#g1)"><line x1="165" y1="82" x2="183" y2="82"/><line x1="330" y1="82" x2="348" y2="82"/><line x1="495" y1="82" x2="513" y2="82"/></g>
<rect x="20" y="128" width="640" height="26" rx="4" fill="#FFF3CD" stroke="#485A64" stroke-width="0.75"/><text x="340" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#485A64">⛔ 여기까지 활동 1 — 멈추고 강의자료 §4 설명 듣기</text>
<rect x="20" y="164" width="640" height="26" rx="13" fill="#0086CD"/><text x="340" y="182" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">활동 2 — 조건 하나 바꾸기와 작업 나누기 (각자)</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="198" width="145" height="72" rx="8"/><rect x="185" y="198" width="145" height="72" rx="8"/><rect x="350" y="198" width="145" height="72" rx="8"/></g>
<rect x="515" y="198" width="145" height="72" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1" stroke-dasharray="4 3"/>
<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="92.5" y="220">4 한 줄 바꾸기</text><text x="257.5" y="220">5 Notebook 비교</text><text x="422.5" y="220">6 보관</text><text x="587.5" y="220">선택, 미션</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="92.5" y="240">새 대화, 같은 요청</text><text x="92.5" y="258">변경 전후 표</text><text x="257.5" y="240">인용 하나 확인</text><text x="257.5" y="258">도구 배분 1줄</text><text x="422.5" y="240">기록 파일 저장</text><text x="422.5" y="258">12주에 다시 사용</text><text x="587.5" y="240">스킬 만들기</text><text x="587.5" y="258">참고 파일 = 내 보고서</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#g1)"><line x1="165" y1="234" x2="183" y2="234"/><line x1="330" y1="234" x2="348" y2="234"/><line x1="495" y1="234" x2="513" y2="234"/></g>
<rect x="20" y="280" width="640" height="26" rx="4" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/><text x="340" y="298" text-anchor="middle" font-size="12" fill="#006199">완료 기준 = 조건 하나를 바꾼 결과의 차이와 채택 이유를 설명</text>
<rect x="20" y="314" width="640" height="26" rx="4" fill="#006199"/><text x="340" y="332" text-anchor="middle" fill="#FFFFFF" font-size="12">단계마다 실행 → 확인 → 다르면 조치 후 표시된 단계로 돌아가기</text></svg>
