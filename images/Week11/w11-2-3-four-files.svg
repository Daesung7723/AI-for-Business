<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>판매 분석의 네 가지</title><desc>코드 파일과 입력 파일은 저장장치에 있고, 실행하면 메모리로 읽혀 CPU가 계산한다. 결과는 화면 출력과 결과 파일 두 곳으로 나간다. 화면 출력은 저장하지 않으면 창을 닫을 때 사라지고, 결과 파일은 저장장치에 남아 다시 열 수 있다.</desc><defs><marker id="f1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="330" fill="#FFFFFF"/>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="20" width="200" height="74" rx="8"/><rect x="20" y="128" width="200" height="74" rx="8"/><rect x="460" y="20" width="200" height="74" rx="8"/><rect x="460" y="128" width="200" height="74" rx="8"/></g>
<rect x="250" y="62" width="180" height="98" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/>
<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="120" y="44">① 코드 파일</text><text x="120" y="152">② 입력 파일</text><text x="560" y="44">③ 화면 출력</text><text x="560" y="152">④ 결과 파일</text><text x="340" y="90">실행</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="120" y="64" font-family="Consolas,'Malgun Gothic',monospace">week11_sales.py</text><text x="120" y="82">무엇을 할지 적은 명령</text><text x="120" y="172" font-family="Consolas,'Malgun Gothic',monospace">Week11_lunchbox_sales.csv</text><text x="120" y="190">처리할 데이터 14행</text><text x="560" y="64">IDLE Shell 창</text><text x="560" y="82">요일별 판매량 표시</text><text x="560" y="172" font-family="Consolas,'Malgun Gothic',monospace">Week11_sales_by_day.csv</text><text x="560" y="190">요일별 판매량 7행</text><text x="340" y="112">메모리에 읽어 두고</text><text x="340" y="130">CPU가 합계를 계산</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#f1)"><path d="M220 57H235V95H248"/><path d="M220 165H235V128H248"/><path d="M430 95H445V57H458"/><path d="M430 128H445V165H458"/></g>
<g font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle"><rect x="20" y="214" width="200" height="22" rx="4" fill="#006199"/><text x="120" y="229">저장장치에 있음</text><rect x="460" y="98" width="200" height="22" rx="4" fill="#485A64"/><text x="560" y="113">창을 닫으면 사라짐</text><rect x="460" y="214" width="200" height="22" rx="4" fill="#006199"/><text x="560" y="229">저장장치에 남음</text></g>
<rect x="20" y="252" width="640" height="34" rx="6" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/><text x="340" y="274" text-anchor="middle" font-size="12" fill="#006199">다음에 다시 사용하려면 = 결과를 파일로 저장하고, 그 파일의 이름과 위치를 기록</text>
<rect x="20" y="292" width="640" height="30" rx="4" fill="#006199"/><text x="340" y="312" text-anchor="middle" font-size="12" fill="#FFFFFF">Gemini 답변 = 코드 블록(코드 파일에 저장할 부분) + 설명 문장(저장하지 않는 부분)</text></svg>
