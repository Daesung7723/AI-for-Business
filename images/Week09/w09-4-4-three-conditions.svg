<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>해석을 바꾸는 세 조건</title><desc>편의점 전년동월대비 증감률에서 통계 단절은 조사 대상이 13개사에서 15개사로 바뀐 기준의 차이, 부분 연도는 2023년 5개월과 2026년 7개월의 기간 차이이다. 비중 없는 평균은 2026년 3월 다섯 품목군의 매출 비중과 증감률을 나란히 보이며, 단순평균 10.2퍼센트와 총계 2.7퍼센트가 다른 이유가 매출 비중임을 나타낸다.</desc><rect width="680" height="470" fill="#FFFFFF"/>
<text x="340" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#485A64">표의 값이 맞아도 해석을 바꾸는 세 조건 · 편의점 전년동월대비 증감률</text>
<g stroke="#485A64" stroke-width="0.75"><line x1="20" y1="142" x2="660" y2="142"/><line x1="20" y1="252" x2="660" y2="252"/></g>
<g font-size="14" font-weight="700" fill="#006199"><text x="24" y="92">통계 단절</text><text x="24" y="202">부분 연도</text><text x="24" y="326">비중 없는</text><text x="24" y="345">평균</text></g>
<rect x="130" y="58" width="176" height="44" fill="#55C3F1" fill-opacity="0.45"/><rect x="310" y="58" width="196" height="44" fill="#0086CD"/>
<line x1="308" y1="48" x2="308" y2="112" stroke="#485A64" stroke-width="1.5" stroke-dasharray="5 4"/>
<g text-anchor="middle" font-size="12"><text x="218" y="76" fill="#485A64">13개사 · 17개월</text><text x="218" y="94" font-size="14" font-weight="700" fill="#006199">+5.16%</text><text x="408" y="76" fill="#FFFFFF">15개사 · 19개월</text><text x="408" y="94" font-size="14" font-weight="700" fill="#FFFFFF">+1.24%</text></g>
<g font-size="12" fill="#485A64"><text x="130" y="128">2023-08</text><text x="308" y="128" text-anchor="middle">2025-01 단절</text><text x="506" y="128" text-anchor="end">2026-07</text></g>
<g font-size="12" fill="#485A64"><text x="130" y="170">2023</text><text x="130" y="194">2024</text><text x="130" y="218">2025</text><text x="130" y="242">2026</text></g>
<rect x="168" y="158" width="85" height="16" fill="#0086CD"/><rect x="168" y="182" width="204" height="16" fill="#55C3F1" fill-opacity="0.45"/><rect x="168" y="206" width="204" height="16" fill="#55C3F1" fill-opacity="0.45"/><rect x="168" y="230" width="119" height="16" fill="#0086CD"/>
<g font-size="12" fill="#485A64"><text x="384" y="171" font-weight="700" fill="#006199">5개월</text><text x="384" y="195">12개월</text><text x="384" y="219">12개월</text><text x="384" y="243" font-weight="700" fill="#006199">7개월</text><text x="506" y="171" text-anchor="end">+6.88%</text><text x="506" y="195" text-anchor="end">+4.45%</text><text x="506" y="219" text-anchor="end">+0.05%</text><text x="506" y="243" text-anchor="end">+3.27%</text></g>
<g font-size="12" font-weight="700" fill="#485A64"><text x="130" y="272">품목군</text><text x="222" y="272">매출 비중</text><text x="404" y="272" text-anchor="end">증감률</text></g>
<g font-size="12" fill="#485A64"><text x="130" y="292">음료 등 가공</text><text x="130" y="312">담배 등 기타</text><text x="130" y="332">즉석(신선일부)</text><text x="130" y="352">생활용품</text><text x="130" y="372" font-weight="700" fill="#006199">잡화</text></g>
<g fill="#55C3F1" fill-opacity="0.45"><rect x="222" y="281" width="93" height="14"/><rect x="222" y="301" width="77" height="14"/><rect x="222" y="321" width="19" height="14"/><rect x="222" y="341" width="7" height="14"/></g><rect x="222" y="361" width="3" height="14" fill="#0086CD"/>
<g font-size="12" fill="#485A64"><text x="319" y="292">46.4%</text><text x="303" y="312">38.6%</text><text x="245" y="332">9.6%</text><text x="233" y="352">3.7%</text><text x="229" y="372" font-weight="700" fill="#006199">1.7%</text></g>
<g font-size="12" fill="#485A64" text-anchor="end"><text x="404" y="292">+2.7</text><text x="404" y="312">+0.2</text><text x="404" y="332">+6.6</text><text x="404" y="352">+10.1</text><text x="404" y="372" font-weight="700" fill="#006199">+31.4</text></g>
<line x1="418" y1="264" x2="418" y2="378" stroke="#485A64" stroke-width="0.75"/>
<g text-anchor="middle"><text x="464" y="288" font-size="12" fill="#485A64">단순평균</text><text x="464" y="308" font-size="16" font-weight="700" fill="#2EA7E0">+10.2%</text><text x="464" y="342" font-size="12" fill="#485A64">총계</text><text x="464" y="362" font-size="16" font-weight="700" fill="#006199">+2.7%</text></g>
<text x="130" y="398" font-size="12" fill="#485A64">2026년 3월 · 비중 1.7%인 잡화의 +31.4%가 단순평균을 높임</text>
<text x="130" y="415" font-size="11" fill="#485A64">매출 비중 출처 = 산업통상부 보도자료(2026-08-26) · 실습 표에는 비중 없음</text>
<g text-anchor="middle"><text x="590" y="78" font-size="16" font-weight="700" fill="#006199">기준</text><text x="590" y="100" font-size="12" fill="#485A64">조사 대상이</text><text x="590" y="116" font-size="12" fill="#485A64">바뀌었는가</text><text x="590" y="186" font-size="16" font-weight="700" fill="#006199">기간</text><text x="590" y="208" font-size="12" fill="#485A64">몇 개월이</text><text x="590" y="224" font-size="12" fill="#485A64">들어 있는가</text><text x="590" y="312" font-size="16" font-weight="700" fill="#006199">크기</text><text x="590" y="334" font-size="12" fill="#485A64">매출 비중이</text><text x="590" y="350" font-size="12" fill="#485A64">반영되었는가</text></g>
<rect x="20" y="426" width="640" height="34" rx="4" fill="#006199"/><text x="340" y="448" text-anchor="middle" fill="#FFFFFF" font-size="13">계산을 검산해도 드러나지 않는다 → 보고서에 단서를 함께 적는다</text></svg>
