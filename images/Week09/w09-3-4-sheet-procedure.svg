<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>시트 실습 절차</title><desc>수식 요청, 붙여 넣기, 검산 뒤 값이 같으면 기록한다. 다르면 표대로 수정을 요청해 1단계로 돌아가고, 2회 뒤에도 실패하면 교수에게 알린다.</desc><defs><marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#485A64" stroke-width="1.5"/></marker></defs><rect width="680" height="340" fill="#FFFFFF"/>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="40" width="110" height="64" rx="6"/><rect x="145" y="40" width="110" height="64" rx="6"/><rect x="270" y="40" width="110" height="64" rx="6"/><rect x="570" y="40" width="90" height="64" rx="6"/></g>
<polygon points="470,32 540,72 470,112 400,72" fill="#FFFFFF" stroke="#0086CD" stroke-width="1.5"/>
<rect x="400" y="160" width="140" height="64" rx="6" fill="#FFFFFF" stroke="#0086CD" stroke-width="1.5"/>
<rect x="380" y="262" width="180" height="64" rx="6" fill="#F0F2F5" stroke="#006199" stroke-width="1.5"/>
<g font-size="14" fill="#485A64" text-anchor="middle" font-weight="700"><text x="75" y="77">① 수식 요청</text><text x="200" y="66">② 조건 확인 후</text><text x="200" y="88">붙여 넣기</text><text x="325" y="77">③ 검산 1개</text><text x="470" y="77" fill="#006199">값이 같은가?</text><text x="615" y="77">⑤ 기록</text><text x="470" y="186">④ 표대로 조치</text><text x="470" y="288" fill="#006199">교수에게 알림</text></g>
<g font-size="12" fill="#485A64" text-anchor="middle"><text x="470" y="208">수정 요청 2회까지</text><text x="470" y="310">교수 제공 수식으로 ③</text><text x="555" y="62">예</text><text x="240" y="182">수정 요청 → ① 다시</text></g>
