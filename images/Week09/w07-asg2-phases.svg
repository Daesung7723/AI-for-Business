<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 684" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>과제 2의 진행 흐름</title><desc>요건 네 개를 Phase 1부터 4까지 구분했다. 각 Phase의 위쪽 파란 칸은 과제 1에서 활용하는 내용이고 아래쪽 회색 칸은 새로 작성할 내용이며, 회색 칸의 내용은 과제 3에서 다시 활용한다. 하위 질문이 조사와 검증 기록으로 이어지고, 조사 결과가 프레임 항목의 근거와 보고서 문단으로 이어진다. 트랙은 Phase 3의 프레임에서만 다르다.</desc><defs><marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="684" fill="#FFFFFF"/>
<g font-size="12" font-weight="700" fill="#485A64" text-anchor="middle"><text x="255" y="30">과제 1 활용 + 새로 작성</text><text x="485" y="30">결과</text></g>
<g transform="translate(0,24)">
<g fill="none" stroke="#C9D1D9" stroke-width="0.75"><rect x="20" y="20" width="640" height="114" rx="10"/><rect x="20" y="162" width="640" height="114" rx="10"/><rect x="20" y="304" width="640" height="130" rx="10"/><rect x="20" y="462" width="640" height="114" rx="10"/></g>
<g font-size="14" font-weight="700" fill="#006199"><text x="34" y="62">Phase 1</text><text x="34" y="204">Phase 2</text><text x="34" y="354">Phase 3</text><text x="34" y="504">Phase 4</text></g>
<g font-size="12" fill="#485A64"><text x="34" y="82">조사 질문 설계</text><text x="34" y="100">요건 ①</text><text x="34" y="224">조사 · 검증 기록</text><text x="34" y="242">요건 ②</text><text x="34" y="374">분석 프레임</text><text x="34" y="392">요건 ③</text><text x="34" y="524">보고서 문단</text><text x="34" y="542">요건 ④</text></g>
<g fill="#E8F5FC" stroke="#0086CD" stroke-width="0.75"><rect x="130" y="30" width="250" height="46" rx="6"/><rect x="130" y="172" width="250" height="46" rx="6"/><rect x="130" y="314" width="250" height="46" rx="6"/><rect x="130" y="472" width="250" height="46" rx="6"/></g>
<g font-size="14" font-weight="700" fill="#006199" text-anchor="middle"><text x="255" y="50">주제 문장 · 시장의 경계</text><text x="255" y="192">주력 도구 · 조사 프롬프트 틀</text><text x="255" y="334">선택한 트랙 · 범위</text><text x="255" y="492">AI 활용 표기 형식</text></g>
<g font-size="12" fill="#006199" text-anchor="middle"><text x="255" y="67">과제 1의 트랙 · 주제 · 선정 이유</text><text x="255" y="209">과제 1의 도구 선택 · 3종 비교</text><text x="255" y="351">과제 1의 트랙 선택 · 시장의 경계</text><text x="255" y="509">과제 1의 세 줄 표기</text></g>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="130" y="80" width="250" height="44" rx="6"/><rect x="130" y="222" width="250" height="44" rx="6"/><rect x="130" y="364" width="250" height="60" rx="6"/><rect x="130" y="522" width="250" height="44" rx="6"/></g>
<g font-size="12" fill="#33424A"><text x="142" y="98">+ 큰 질문 1개 → 하위 질문 3~4개</text><text x="142" y="115">+ 사실 질문 · 해석 질문 표시</text><text x="142" y="240">+ 프롬프트 · 답변 핵심 기록</text><text x="142" y="257">+ 출처 확인 · 「미확인」 표시</text><text x="142" y="382">+ 트랙 A: PEST · Five Forces</text><text x="142" y="399">+ 트랙 B: 세분화 · 페르소나 또는 3C</text><text x="142" y="416">+ 항목마다 근거 · 「그래서:」 소결론</text><text x="142" y="540">+ 조사 결과 한 부분을 문단으로(A4 반 장)</text><text x="142" y="557">+ 사실은 출처와, 해석은 근거와 함께</text></g>
<g fill="#FFFFFF" stroke="#485A64" stroke-width="1.25"><rect x="410" y="53" width="150" height="50" rx="6"/><rect x="410" y="195" width="150" height="50" rx="6"/><rect x="410" y="340" width="150" height="50" rx="6"/><rect x="410" y="495" width="150" height="50" rx="6"/></g>
<g font-size="13" font-weight="700" fill="#33424A" text-anchor="middle"><text x="485" y="74">하위 질문 목록</text><text x="485" y="216">조사 결과 · 검증 기록</text><text x="485" y="361">프레임 분석 · 소결론</text><text x="485" y="516">보고서 문단 1절</text></g>
<g font-size="12" fill="#485A64" text-anchor="middle"><text x="485" y="93">사실 · 해석 표시</text><text x="485" y="235">확인 · 미확인 표시</text><text x="485" y="380">항목마다 근거</text><text x="485" y="535">자기 문장으로 작성</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.25"><path d="M380 53H395V78"/><path d="M380 102H395V78H408" marker-end="url(#m1)"/><path d="M380 195H395V220"/><path d="M380 244H395V220H408" marker-end="url(#m1)"/><path d="M380 337H395V365"/><path d="M380 394H395V365H408" marker-end="url(#m1)"/><path d="M380 495H395V520"/><path d="M380 544H395V520H408" marker-end="url(#m1)"/><path d="M430 103V148H255V170" marker-end="url(#m1)"/><path d="M430 245V290H255V312" marker-end="url(#m1)"/><path d="M560 220H585V448H290V470" marker-end="url(#m1)"/><path d="M430 390V440H240V470" marker-end="url(#m1)"/></g>
<g font-size="12" fill="#485A64" text-anchor="end"><text x="247" y="152">하위 질문 1개 = 프롬프트 1개</text><text x="247" y="294">프레임 항목의 근거로</text><text x="232" y="452">소결론 · 조사 결과를 문단으로</text></g>
<rect x="70" y="589" width="22" height="14" rx="3" fill="#E8F5FC" stroke="#0086CD" stroke-width="0.75"/><text x="98" y="600" font-size="12" fill="#006199">과제 1에서 활용</text><line x1="195" y1="596" x2="221" y2="596" stroke="#2EA7E0" stroke-width="1.25" marker-end="url(#m1)"/>
<rect x="232" y="589" width="22" height="14" rx="3" fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"/><text x="260" y="600" font-size="12" fill="#33424A">과제 2에서 새로 작성</text><line x1="387" y1="596" x2="413" y2="596" stroke="#2EA7E0" stroke-width="1.25" marker-end="url(#m1)"/><rect x="424" y="589" width="22" height="14" rx="3" fill="#FDECEA" stroke="#C0392B" stroke-width="0.75"/><text x="452" y="600" font-size="12" fill="#B3261E">과제 3에서 새로 보완</text>
<rect x="20" y="614" width="640" height="32" rx="4" fill="#006199"/><text x="340" y="635" text-anchor="middle" font-size="13" fill="#FFFFFF">회색 칸에 작성한 내용을 과제 3에서 다시 활용한다</text>
</g></svg>
