<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>수치 오류 세 유형</title><desc>원본 표와 AI 답변을 비교해 단위 혼동, 없는 값 생성, 합계 오산이 나타나는 위치를 표시한다.</desc><defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="310" fill="#FFFFFF"/>
<g font-size="13" fill="#485A64" text-anchor="middle" font-weight="700"><text x="120" y="28">원본 표</text><text x="350" y="28">AI 답변</text></g>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="30" y="40" width="180" height="36"/><rect x="260" y="40" width="180" height="36"/></g>
<g fill="#FFFFFF" stroke="#485A64" stroke-width="0.75"><rect x="30" y="76" width="180" height="36"/><rect x="30" y="112" width="180" height="36"/><rect x="30" y="184" width="180" height="36"/><rect x="260" y="76" width="180" height="36"/><rect x="260" y="112" width="180" height="36"/><rect x="260" y="184" width="180" height="36"/></g>
<rect x="260" y="148" width="180" height="36" fill="#E8F5FC" stroke="#0086CD" stroke-width="1.5" stroke-dasharray="6 4"/>
<g font-size="13" fill="#485A64" text-anchor="middle"><text x="120" y="63">단위: 백만 원</text><text x="120" y="99">항목 1</text><text x="120" y="135">항목 2</text><text x="120" y="207" font-weight="700">합계</text><text x="350" y="63">단위: 억 원</text><text x="350" y="99">항목 1</text><text x="350" y="135">항목 2</text><text x="350" y="171" fill="#006199" font-weight="700">표에 없는 행</text><text x="350" y="207" font-weight="700">합계</text></g>
<line x1="210" y1="130" x2="258" y2="130" fill="none" stroke="#2EA7E0" stroke-width="1.25" marker-end="url(#a2)"/>
<g font-size="13" fill="#485A64"><text x="456" y="63" font-weight="700">단위 혼동</text><text x="456" y="171" font-weight="700" fill="#006199">없는 값 생성</text><text x="456" y="197" font-weight="700">합계 오산</text><text x="456" y="216" font-size="12">항목은 같으나 합계가 다름</text></g>
<rect x="20" y="256" width="640" height="36" rx="4" fill="#006199"/><text x="340" y="279" text-anchor="middle" fill="#FFFFFF" font-size="13">표를 제시해도 수치는 확인해야 한다</text></svg>
