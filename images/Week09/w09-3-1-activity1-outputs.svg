<g font-size="11" fill="#485A64"><text x="262" y="113" font-weight="700">연도별 총계 평균</text><text x="262" y="131">2023 · 5개월</text><text x="262" y="147">2024</text><text x="262" y="163">2025</text><text x="262" y="179">2026 · 7개월</text><text x="262" y="209" font-weight="700">품목군별 최근 12개월 평균</text><text x="262" y="230">음료 등 가공 · 즉석(신선일부)</text><text x="262" y="247">생활용품 · 잡화 · 담배 등 기타</text></g>
