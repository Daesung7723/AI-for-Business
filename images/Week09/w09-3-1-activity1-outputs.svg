<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>활동 1에서 만드는 것</title><desc>토론에서 분석 질문 1개를, 실습에서 집계 표 2개와 막대 차트 1개를 만들고 활동 2의 입력으로 넘긴다.</desc><defs><marker id="i1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="400" fill="#FFFFFF"/>
