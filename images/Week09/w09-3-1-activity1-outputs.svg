<rect x="20" y="300" width="640" height="46" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/><text x="340" y="319" text-anchor="middle" font-size="13" font-weight="700" fill="#006199">활동 2의 입력</text><text x="340" y="337" text-anchor="middle" font-size="12" fill="#485A64">질문과 집계 표를 AI에 제시해 초안 받기 · 초안의 수치를 표와 대조 · 보고서의 질문과 데이터 요약에 사용</text>
