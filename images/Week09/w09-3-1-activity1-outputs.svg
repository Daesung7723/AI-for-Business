<rect x="34" y="104" width="162" height="96" rx="10" fill="#FFFFFF" stroke="#0086CD" stroke-width="1.25"/><path d="M70 200l-6 18 22-18z" fill="#FFFFFF" stroke="#0086CD" stroke-width="1.25"/>
<g font-size="12" fill="#485A64" text-anchor="middle"><text x="115" y="136">최근 1년 동안 어느</text><text x="115" y="154">품목군의 평균 증감률이</text><text x="115" y="172">가장 높았는가</text><text x="115" y="246">이 표로 답할 수 있는 질문</text></g>
<g fill="#FFFFFF" stroke="#485A64" stroke-width="0.5"><rect x="254" y="100" width="172" height="84"/><rect x="254" y="196" width="172" height="62"/></g>
