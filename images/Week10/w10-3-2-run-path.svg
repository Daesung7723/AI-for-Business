<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>실행 경로 확인</title><desc>대화형 셸에 import idlelib.idle을 입력해 IDLE 창이 열리면 IDLE 경로, 열리지 않으면 Colab 경로로 진행하고, 두 경로 모두 같은 기준으로 출력을 확인한다.</desc><defs><marker id="r1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="420" fill="#FFFFFF"/>
<rect x="170" y="14" width="340" height="46" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/><text x="340" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#006199">준비 — 대화형 셸에 입력</text><text x="340" y="52" text-anchor="middle" font-size="12" fill="#485A64" font-family="Consolas,'Malgun Gothic',monospace">import idlelib.idle</text>
<line x1="340" y1="60" x2="340" y2="84" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#r1)"/>
<polygon points="220,112 340,86 460,112 340,138" fill="#0086CD"/><text x="340" y="117" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">IDLE 창이 열리는가</text>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#r1)"><path d="M220 112H170V168"/><path d="M460 112H510V168"/></g>
<g font-size="12" font-weight="700" fill="#006199"><text x="186" y="104">예</text><text x="470" y="104">아니요</text></g>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="170" width="300" height="152" rx="8"/><rect x="360" y="170" width="300" height="152" rx="8"/></g>
<rect x="20" y="170" width="300" height="30" rx="8" fill="#006199"/><text x="170" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">IDLE 경로</text>
<rect x="360" y="170" width="300" height="30" rx="8" fill="#0086CD"/><text x="510" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Colab 경로</text>
<g font-size="12" fill="#485A64"><text x="36" y="222">① File → New File</text><text x="36" y="243">② 받은 코드 붙여 넣기</text><text x="36" y="264">③ 지표 파일과 같은 폴더에 저장</text><text x="36" y="285">④ Run → Run Module (F5)</text><text x="36" y="306">⑤ 파일 이름 입력</text>
<text x="376" y="222">① 새 노트 열기</text><text x="376" y="243">② 왼쪽 파일 창에 지표 파일 업로드</text><text x="376" y="264">③ 코드 셀에 코드 붙여 넣기</text><text x="376" y="285">④ 셀 실행</text><text x="376" y="306">⑤ 파일 이름 입력</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#r1)"><line x1="170" y1="322" x2="170" y2="344"/><line x1="510" y1="322" x2="510" y2="344"/></g>
<rect x="20" y="346" width="640" height="34" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/><text x="340" y="368" text-anchor="middle" font-size="13" fill="#006199"><tspan font-weight="700">출력 확인</tspan> — 읽은 행 수 33, 기간 2024-01 ~ 2026-09, 지표마다 최신 값</text>
<rect x="20" y="388" width="640" height="28" rx="4" fill="#006199"/><text x="340" y="407" text-anchor="middle" fill="#FFFFFF" font-size="13">경로는 달라도 확인 기준은 같다</text></svg>
