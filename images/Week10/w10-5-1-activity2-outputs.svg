<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 256" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>활동 2에서 하는 것</title><desc>같은 대화에서 차트 기능을 추가하고, 확인 질문에 답한 뒤, 한 달이 추가된 파일로 다시 실행하고, 코드 파일을 13주에 다시 사용하도록 보관한다.</desc><defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="256" fill="#FFFFFF"/>
<rect x="20" y="14" width="640" height="28" rx="14" fill="#0086CD"/><text x="340" y="33" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">활동 2 — 각자 진행</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="54" width="145" height="118" rx="8"/><rect x="185" y="54" width="145" height="118" rx="8"/><rect x="350" y="54" width="145" height="118" rx="8"/><rect x="515" y="54" width="145" height="118" rx="8"/></g>
<g font-size="14" font-weight="700" fill="#006199" text-anchor="middle"><text x="92.5" y="82">4 차트 기능 추가</text><text x="257.5" y="82">5 확인 질문</text><text x="422.5" y="82">6 다시 실행</text><text x="587.5" y="82">7 코드 보관</text></g>
<g font-size="12" fill="#485A64" text-anchor="middle"><text x="92.5" y="110">같은 대화에서 요청</text><text x="92.5" y="130">가로축(월)을 맞춘</text><text x="92.5" y="148">위아래 그래프</text>
<text x="257.5" y="110">기준금리가 바뀐 뒤</text><text x="257.5" y="130">다른 지표 하나의</text><text x="257.5" y="148">방향, 시차, 기간</text>
<text x="422.5" y="110">한 달 추가 파일</text><text x="422.5" y="130">코드는 그대로</text><text x="422.5" y="148">34행, 끝 월 2026-10</text>
<text x="587.5" y="110">13주 코드 도구 ②</text><text x="587.5" y="130">계산기에서</text><text x="587.5" y="148">다시 사용</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#a2)"><line x1="165" y1="113" x2="183" y2="113"/><line x1="330" y1="113" x2="348" y2="113"/><line x1="495" y1="113" x2="513" y2="113"/></g>
<rect x="20" y="184" width="640" height="30" rx="8" fill="#E8F5FC" stroke="#0086CD" stroke-width="1"/><text x="340" y="204" text-anchor="middle" font-size="12" fill="#485A64"><tspan font-weight="700" fill="#006199">제출 없음</tspan> — 남는 것은 각자 만든 코드 파일과 그 출력(표, 차트)</text>
<rect x="20" y="222" width="640" height="28" rx="4" fill="#006199"/><text x="340" y="241" text-anchor="middle" fill="#FFFFFF" font-size="13">코드를 고치지 않고 파일만 바꾸어 다시 사용한다</text></svg>
