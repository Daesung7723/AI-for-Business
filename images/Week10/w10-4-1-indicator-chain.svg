<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>지표의 연쇄</title><desc>기준금리 인상이 대출 이자 부담, 소비와 투자, 기업 실적, 고용으로 이어지고, 금리 변화는 환율과 수입 물가를 거쳐 물가로 이어지며, 물가는 다시 금리 결정에 영향을 준다. 화살표마다 시차가 있다.</desc><defs><marker id="c1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker><marker id="c2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#006199" stroke-width="1.5"/></marker></defs><rect width="680" height="330" fill="#FFFFFF"/>
<rect x="20" y="40" width="106" height="52" rx="8" fill="#0086CD"/>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="153" y="40" width="106" height="52" rx="8"/><rect x="286" y="40" width="106" height="52" rx="8"/><rect x="419" y="40" width="106" height="52" rx="8"/><rect x="552" y="40" width="106" height="52" rx="8"/></g>
<g font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF"><text x="73" y="62">기준금리</text><text x="73" y="80">인상</text></g>
<g font-size="13" font-weight="700" text-anchor="middle" fill="#485A64"><text x="206" y="62">대출 이자</text><text x="206" y="80">부담 증가</text><text x="339" y="62">소비, 투자</text><text x="339" y="80">위축</text><text x="472" y="62">기업 실적</text><text x="472" y="80">둔화</text><text x="605" y="62">고용</text><text x="605" y="80">축소</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#c1)"><line x1="126" y1="66" x2="151" y2="66"/><line x1="259" y1="66" x2="284" y2="66"/><line x1="392" y1="66" x2="417" y2="66"/><line x1="525" y1="66" x2="550" y2="66"/></g>
<g fill="#E8F5FC" stroke="#55C3F1" stroke-width="0.75"><rect x="121" y="14" width="37" height="18" rx="9"/><rect x="254" y="14" width="37" height="18" rx="9"/><rect x="387" y="14" width="37" height="18" rx="9"/><rect x="520" y="14" width="37" height="18" rx="9"/></g>
<g font-size="10" text-anchor="middle" fill="#006199"><text x="139.5" y="27">시차</text><text x="272.5" y="27">시차</text><text x="405.5" y="27">시차</text><text x="538.5" y="27">시차</text></g>
<g fill="#FFFFFF" stroke="#2EA7E0" stroke-width="1"><rect x="153" y="200" width="106" height="52" rx="8"/><rect x="286" y="200" width="106" height="52" rx="8"/><rect x="419" y="200" width="106" height="52" rx="8"/></g>
<g font-size="13" font-weight="700" text-anchor="middle" fill="#006199"><text x="206" y="231">환율 변동</text><text x="339" y="222">수입 물가</text><text x="339" y="240">변동</text><text x="472" y="231">물가 변동</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#c1)"><path d="M90 92V226H151"/><line x1="259" y1="226" x2="284" y2="226"/><line x1="392" y1="226" x2="417" y2="226"/></g>
<text x="98" y="150" font-size="11" fill="#485A64">환율 경로</text>
<path d="M472 252V278H40V94" fill="none" stroke="#006199" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#c2)"/>
<text x="256" y="272" text-anchor="middle" font-size="11" fill="#006199">순환 구조 — 물가가 다시 금리 결정에 영향을 준다</text>
<rect x="20" y="294" width="640" height="28" rx="4" fill="#006199"/><text x="340" y="313" text-anchor="middle" fill="#FFFFFF" font-size="13">하나가 움직이면 다음이 움직인다 — 화살표마다 시차가 있다</text></svg>
