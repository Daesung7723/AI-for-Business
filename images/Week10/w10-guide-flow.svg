<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 312" role="img" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>10주 실습 지침의 흐름</title><desc>활동 1은 준비, 코드 요청, 실행, 대조의 네 단계이고, 강의자료 4절 설명을 들은 뒤 활동 2의 차트 추가, 확인 질문, 다시 실행, 보관을 진행한다. 모든 단계는 각자 진행한다.</desc><defs><marker id="g1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2EA7E0" stroke-width="1.5"/></marker></defs><rect width="680" height="312" fill="#FFFFFF"/>
<rect x="20" y="12" width="640" height="26" rx="13" fill="#006199"/><text x="340" y="30" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">활동 1 — 지표 표 도구 만들기 (각자)</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="46" width="145" height="72" rx="8"/><rect x="185" y="46" width="145" height="72" rx="8"/><rect x="350" y="46" width="145" height="72" rx="8"/><rect x="515" y="46" width="145" height="72" rx="8"/></g>
<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="92.5" y="68">준비</text><text x="257.5" y="68">1 코드 요청</text><text x="422.5" y="68">2 실행</text><text x="587.5" y="68">3 대조</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="92.5" y="88">지표 파일 2개</text><text x="92.5" y="106">실행 경로 확인</text><text x="257.5" y="88">Gemini 앱에 요청</text><text x="257.5" y="106">강의자료 3.2</text><text x="422.5" y="88">읽은 행 수 33</text><text x="422.5" y="106">IDLE 또는 Colab</text><text x="587.5" y="88">최근 수치 표</text><text x="587.5" y="106">값 1개를 파일과 대조</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#g1)"><line x1="165" y1="82" x2="183" y2="82"/><line x1="330" y1="82" x2="348" y2="82"/><line x1="495" y1="82" x2="513" y2="82"/></g>
<rect x="20" y="128" width="640" height="26" rx="4" fill="#FFF3CD" stroke="#485A64" stroke-width="0.75"/><text x="340" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#485A64">⛔ 여기까지 활동 1 — 멈추고 강의자료 §4 설명 듣기</text>
<rect x="20" y="164" width="640" height="26" rx="13" fill="#0086CD"/><text x="340" y="182" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">활동 2 — 차트 기능 추가와 다시 실행 (각자)</text>
<g fill="#F0F2F5" stroke="#485A64" stroke-width="0.75"><rect x="20" y="198" width="145" height="72" rx="8"/><rect x="185" y="198" width="145" height="72" rx="8"/><rect x="350" y="198" width="145" height="72" rx="8"/><rect x="515" y="198" width="145" height="72" rx="8"/></g>
<g font-size="13" font-weight="700" fill="#006199" text-anchor="middle"><text x="92.5" y="220">4 차트 추가</text><text x="257.5" y="220">5 확인 질문</text><text x="422.5" y="220">6 다시 실행</text><text x="587.5" y="220">7 보관</text></g>
<g font-size="11" fill="#485A64" text-anchor="middle"><text x="92.5" y="240">같은 대화에서 요청</text><text x="92.5" y="258">바뀐 달 6개</text><text x="257.5" y="240">방향, 시차, 기간</text><text x="257.5" y="258">강의자료 4.5</text><text x="422.5" y="240">한 달 추가 파일</text><text x="422.5" y="258">34행, 끝 월 2026-10</text><text x="587.5" y="240">코드 파일</text><text x="587.5" y="258">13주에 다시 사용</text></g>
<g fill="none" stroke="#2EA7E0" stroke-width="1.5" marker-end="url(#g1)"><line x1="165" y1="234" x2="183" y2="234"/><line x1="330" y1="234" x2="348" y2="234"/><line x1="495" y1="234" x2="513" y2="234"/></g>
<rect x="20" y="280" width="640" height="26" rx="4" fill="#006199"/><text x="340" y="298" text-anchor="middle" fill="#FFFFFF" font-size="12">단계마다 실행 → 확인 → 다르면 조치 후 표시된 단계로 돌아가기</text></svg>
